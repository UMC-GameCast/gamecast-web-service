<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GAMECAST</title>
    <!-- Pretendard 폰트 로드 (CDN 직접) -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- Google Fonts - Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    <!-- esamanru OTF 폰트 - 웹폰트 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Esamanru@main/Esamanru.css" type="text/css"/>
    <!-- 87MM ILSANG 폰트 대체 - Godo 폰트 (비슷한 스타일) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/GodoM@main/GodoM.css" type="text/css"/>
    <!-- 추가: Pretendard Variable도 이탤릭 지원 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Bagel+Fat+One&display=swap" rel="stylesheet">
    <!-- 감정별 폰트 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/SkyblassingInjeFont@main/SkyblassingInjeFont.css" type="text/css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/HakgyoansimTuho@main/HakgyoansimTuho.css" type="text/css"/>
  </head>
  <body style="background-color: black; margin: 0; padding: 0;">
    <svg style="display:none">
      <filter id="pixelate" x="0" y="0">
        <feFlood x="4" y="4" height="4" width="4"/>
        <feComposite width="4" height="4"/>
        <feTile result="a"/>
        <feComposite in="SourceGraphic" in2="a" operator="in"/>
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
